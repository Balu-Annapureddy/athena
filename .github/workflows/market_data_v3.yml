name: Athena Market Data V3 Tests
on:
  push:
    branches: [feat/market-data-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight tests
        run: python -m pip install pytest
      - name: Compile modules
        run: python -m compileall -q core/data/connectors/upstox_v3_market_data.py core/data/connectors/upstox_v3_stream.py scripts/verify_upstox_market_data.py scripts/run_market_terminal.py core/data/connectors/candle_reconciliation.py core/data/technical_analysis.py core/data/paper_journal.py core/data/research_store.py core/data/market_overview.py
      - name: Run offline market data tests
        run: python -m pytest tests/test_upstox_v3_market_data.py tests/test_upstox_v3_stream.py tests/test_candle_reconciliation.py tests/test_market_terminal.py tests/test_technical_analysis.py tests/test_paper_journal.py tests/test_research_store.py tests/test_market_overview.py -q
      - name: Validate terminal inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("terminal/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          assert scripts, "No inline scripts found"
          Path("/tmp/athena-terminal-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/athena-terminal-inline.js
