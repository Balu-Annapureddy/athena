name: Athena Market Data V3 Tests
on:
  push:
    branches: [feat/market-data-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight tests
        run: python -m pip install pytest
      - name: Compile modules
        run: python -m compileall -q core/data/connectors/upstox_v3_market_data.py core/data/connectors/upstox_v3_stream.py scripts/verify_upstox_market_data.py
      - name: Run offline market data tests
        run: python -m pytest tests/test_upstox_v3_market_data.py tests/test_upstox_v3_stream.py -q
