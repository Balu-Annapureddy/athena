name: Athena CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Lint, Type Check, and Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov ruff mypy

    - name: Lint with ruff
      run: |
        ruff check core/ scripts/ --select=E,F,W,I --ignore=E501
      continue-on-error: false

    - name: Type check with mypy
      run: |
        mypy core/ --ignore-missing-imports --no-error-summary
      continue-on-error: true   # warn but don't block until baseline established

    - name: Execute tests with coverage
      run: |
        pytest tests/ -q --cov=core --cov-report=term-missing --cov-report=xml
      env:
        ATHENA_AUTH_BYPASS: "true"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml
