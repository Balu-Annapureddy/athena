[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-platform"
version = "1.0.0"
description = "Athena Cognitive Reasoning Platform"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "yfinance>=0.2",
    "requests>=2.28.0",
    "pyotp>=2.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[project.scripts]
athena = "core.api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

